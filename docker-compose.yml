# Déploiement de l'application ADM sur une VM : docker compose up -d --build
# Configuration : copier .env.docker.example en .env et l'adapter (voir deploy/DOCKER.md).
services:
  adm:
    build: .
    image: adm-platform:latest
    container_name: adm-platform
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADM_PORT:-8080}:8000"
    volumes:
      # Base SQLite et clé secrète : conservées entre les mises à jour et les redémarrages
      - adm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  adm-data:
